<div id="lyrics-files-proposal" aria-label="가사와 파일 통합 편집 목업">
<style>
#lyrics-files-proposal{--paper:light-dark(#ffffff,#242d30);--ink:light-dark(#243044,#edf3f4);--soft:light-dark(#64748b,#aebdca);--line:light-dark(#dce5e4,#465254);--tone:light-dark(#e8f6ec,#1c352a);font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--tone);border-radius:22px;overflow:hidden;border:1px solid var(--line)}
#lyrics-files-proposal *{box-sizing:border-box}#lyrics-files-proposal button,#lyrics-files-proposal input,#lyrics-files-proposal textarea,#lyrics-files-proposal select{font:inherit;color:inherit}#lyrics-files-proposal button{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}#lyrics-files-proposal button:hover{filter:brightness(.96)}#lyrics-files-proposal .top{display:flex;align-items:center;gap:18px;padding:20px 22px 0;background:light-dark(#f3f6fa,#252b34);flex-wrap:wrap}#lyrics-files-proposal .title{font-size:22px;font-weight:700;align-self:flex-start}#lyrics-files-proposal .tabs{display:flex;align-self:stretch;align-items:end;gap:5px;margin-left:auto}#lyrics-files-proposal .tab{border:0;border-radius:12px 12px 0 0;min-height:56px;background:#007aff;color:white}#lyrics-files-proposal .tab:nth-child(2){background:#ff3038}#lyrics-files-proposal .tab.active{background:var(--tone);color:var(--ink);border-top:4px solid #1dbf46}#lyrics-files-proposal .save{margin-bottom:12px}#lyrics-files-proposal .body{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:18px;padding:22px}#lyrics-files-proposal section{background:var(--paper);border-radius:16px;padding:20px;min-width:0}#lyrics-files-proposal h3{font-size:18px;margin:0}#lyrics-files-proposal .heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}#lyrics-files-proposal .actions{display:flex;gap:8px;flex-wrap:wrap}#lyrics-files-proposal .sub{color:var(--soft);font-size:13px}#lyrics-files-proposal .lyric-row{display:grid;grid-template-columns:48px minmax(0,1fr) 44px;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 0}#lyrics-files-proposal input,#lyrics-files-proposal textarea,#lyrics-files-proposal select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px;background:light-dark(#f8faf9,#192422)}#lyrics-files-proposal .tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 22px}#lyrics-files-proposal .tile{flex-direction:column;aspect-ratio:1;gap:12px;max-height:130px}#lyrics-files-proposal .tile svg{width:28px;height:28px}#lyrics-files-proposal .export{width:100%}#lyrics-files-proposal .footer{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px}#lyrics-files-proposal .detail{padding:14px;background:var(--tone);border-radius:10px;margin:8px 0}#lyrics-files-proposal .detail label{display:block;margin:8px 0}#lyrics-files-proposal [hidden]{display:none!important}#lyrics-files-proposal .sheet{margin:0 22px 22px;background:var(--paper);border-radius:16px;padding:20px;border:1px solid var(--line)}#lyrics-files-proposal .sheet textarea{min-height:140px}#lyrics-files-proposal .choice{display:flex;align-items:center;gap:10px;padding:10px 0}#lyrics-files-proposal .choice input{width:20px;height:20px}#lyrics-files-proposal .status{padding:0 22px 16px;color:var(--soft);font-size:13px}#lyrics-files-proposal .status:empty{display:none}@media(max-width:640px){#lyrics-files-proposal .body{grid-template-columns:1fr;padding:14px}#lyrics-files-proposal .top{padding:14px 14px 0;gap:8px}#lyrics-files-proposal .tabs{order:3;width:100%;margin:0}#lyrics-files-proposal .save{margin-left:auto}#lyrics-files-proposal section{padding:16px}}
</style>
<header class="top"><span class="title">편집</span><nav class="tabs" aria-label="편집 탭"><button class="tab" data-action="other">곡 정보</button><button class="tab" data-action="other">악보 편집</button><button class="tab active" aria-current="page">가사·파일</button></nav><button class="save" aria-label="저장" data-action="save"><i data-lucide="check" aria-hidden="true"></i></button></header>
<div class="body">
<section aria-label="가사 편집"><div class="heading"><h3>가사</h3><div class="actions"><button data-action="full">전체 보기</button><button data-action="upload" id="lf-upload">교체</button></div></div>
<div id="lf-present"><div class="actions" style="margin-bottom:16px"><button data-action="add"><i data-lucide="plus" aria-hidden="true"></i>가사 추가</button><button data-action="range">현재 마디 주변</button></div><div id="lf-rows"></div><div id="lf-detail" class="detail" hidden><div class="heading"><strong>가사 위치</strong><button data-action="detail-close" aria-label="위치 편집 닫기"><i data-lucide="x" aria-hidden="true"></i></button></div><label>시작 <input value="23마디 · 1박" aria-label="가사 시작 위치"></label><label>끝 <input value="24마디 · 1박" aria-label="가사 끝 위치"></label></div><div class="footer"><span class="sub">23–26마디</span><div class="actions"><button data-action="prev" aria-label="이전 마디"><i data-lucide="chevron-left" aria-hidden="true"></i></button><button data-action="next" aria-label="다음 마디"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div></div></div>
<div id="lf-empty" hidden><button data-action="upload">가사 업로드</button></div>
</section>
<section aria-label="파일 관리"><h3>파일</h3><div class="tools"><button class="tile" data-action="score"><i data-lucide="file-music" aria-hidden="true"></i>악보 교체</button><button class="tile" data-action="audio"><i data-lucide="audio-lines" aria-hidden="true"></i>음원 교체</button></div><button class="export" data-action="export"><i data-lucide="share" aria-hidden="true"></i>내보내기</button></section>
</div>
<div class="sheet" id="lf-sheet" hidden><div class="heading"><h3 id="lf-sheet-title"></h3><button data-action="close" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></div><div id="lf-sheet-body"></div></div><div class="status" role="status" id="lf-status"></div>
<script>
(()=>{const root=document.getElementById('lyrics-files-proposal'),q=s=>root.querySelector(s);let start=23;const state={hasLyrics:true,sideBySide:true};const samples=['스베테오 테니이레테','스베테오 우시낫테','키오쿠 유비노 아이다','스리누케테모'];function rows(){q('#lf-rows').innerHTML=samples.map((s,i)=>`<div class="lyric-row"><span class="sub">${start+i}마디</span><input aria-label="${start+i}마디 가사" value="${s}"><button data-action="detail" aria-label="${start+i}마디 가사 위치 편집"><i data-lucide="sliders-horizontal" aria-hidden="true"></i></button></div>`).join('');q('.footer .sub').textContent=`${start}–${start+3}마디`;if(globalThis.lucide)lucide.createIcons();}function render(){q('#lf-present').hidden=!state.hasLyrics;q('#lf-empty').hidden=state.hasLyrics;q('#lf-upload').hidden=!state.hasLyrics;q('.body').style.gridTemplateColumns=state.sideBySide?'':'1fr';}function sheet(title,body){q('#lf-sheet-title').textContent=title;q('#lf-sheet-body').innerHTML=body;q('#lf-sheet').hidden=false;}rows();render();root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='detail')q('#lf-detail').hidden=false;if(a==='detail-close')q('#lf-detail').hidden=true;if(a==='close')q('#lf-sheet').hidden=true;if(a==='next'||a==='prev'){start=Math.max(1,start+(a==='next'?4:-4));rows();}if(a==='range'){start=23;rows();}if(a==='full')sheet('전체 가사 보기',samples.map(s=>`<p>${s}</p>`).join(''));if(a==='upload')sheet(state.hasLyrics?'가사 교체':'가사 업로드','<textarea aria-label="가사 텍스트" placeholder="타임라인이 있는 가사를 입력하세요.\n타임라인이 없으면 마디별로 줄바꿈 또는 쉼표로 구분하세요."></textarea><p class="sub">교체하면 기존 가사와 위치 정보가 바뀝니다.</p><button data-action="preview">미리보기</button>');if(a==='score')sheet('악보 교체','<label>MusicXML 또는 PDF<input type="file" accept=".xml,.musicxml,.mxl,.pdf"></label>');if(a==='audio')sheet('음원 교체','<label>음원 파일<input type="file" accept="audio/*"></label>');if(a==='export')sheet('내보내기',['MusicXML','원본 PDF 악보','원본 음원','재생용 HTML'].map((s,i)=>`<label class="choice"><input type="checkbox" ${i===0?'checked':''}>${s}</label>`).join('')+'<button data-action="download">선택한 파일 내보내기</button>');if(a==='save'||a==='download'||a==='preview'||a==='other'||a==='add')q('#lf-status').textContent='목업입니다. 실제 저장·파일 변경은 수행하지 않습니다.';});if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(state,'hasLyrics',{label:'가사 있음'});t.addToggle(state,'sideBySide',{label:'가사·파일 좌우 배치'});}})();
</script>
</div>

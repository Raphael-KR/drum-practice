name: Portable checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The committed include and lockfile are sufficient; no personal catalog path.
      - name: Install from repository catalog and lockfile
        run: pnpm install --frozen-lockfile
      # check:docs inside check validates local file links and Markdown anchors.
      - name: Common static checks (including document anchors) and portable tests
        run: pnpm run verify:portable

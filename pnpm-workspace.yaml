  "esbuild": "0.28.2"
  "eslint": "10.13.0"
  "eslint-config-prettier": "10.1.8"
  "fake-indexeddb": "6.2.6"
  "globals": "17.13.0"
  "jsdom": "26.1.0"
  "jszip": "3.10.2"
  "music-metadata": "12.2.3"
  "music-tempo": "1.0.3"
  "opensheetmusicdisplay": "2.2.1"
  "pdfjs-dist": "6.4.299"

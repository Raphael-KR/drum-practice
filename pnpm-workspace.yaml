packages:
  - hosting

overrides:
  "opensheetmusicdisplay>jszip": "catalog:"
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "miniflare>undici": 7.30.1
  # GHSA-g3hv-75wg-m249; remove when lint tools adopt patched minimatch.
  "minimatch@10": 11.0.5
  # Use the linter's own supported JS API instead of the root native compiler.
  "typescript-eslint@8>typescript:peer": "-"

packageExtensions:
  typescript-eslint@8:
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2

allowBuilds:
  esbuild: true
  fsevents: true
  workerd: true
  # Optional headless WebGL is not used by the browser app or existing tests.
  gl: false

enablePrePostScripts: true

# Direct versions come from the committed copy of the shared catalog.
catalogMode: strict
saveExact: true
include:
  ./config/shared-catalog.yaml: [catalog]
minimumReleaseAgeExclude:
  - opensheetmusicdisplay@2.3.0
patchedDependencies:
  opensheetmusicdisplay@2.3.0: config/patches/opensheetmusicdisplay@2.3.0.patch

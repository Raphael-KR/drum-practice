packages:
  - hosting

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "miniflare>undici": 7.30.1

allowBuilds:
  esbuild: true
  fsevents: true
  workerd: true
  # Optional headless WebGL is not used by the browser app or existing tests.
  gl: false

enablePrePostScripts: true

# Direct versions come from the committed copy of the shared catalog.
catalogMode: strict
saveExact: true
include:
  ./config/shared-catalog.yaml: [catalog]

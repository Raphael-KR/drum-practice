<!doctype html><html><head><meta charset="utf-8"><title>OSMD 2.1.2 filled=no reproduction</title></head><body>
<h1>OSMD 2.1.2 — normal notehead filled=no</h1><p>Each bar: first note explicit hollow, second note default filled. Quarter / eighth / sixteenth. No application patches.</p><div id="score"></div><pre id="result">Rendering</pre>
<script type="module">
import OSMD from '/node_modules/.vite/deps/opensheetmusicdisplay.js';
const {OpenSheetMusicDisplay}=OSMD;
const note=(type,duration,hollow)=>`<note><unpitched><display-step>G</display-step><display-octave>5</display-octave></unpitched><duration>${duration}</duration><instrument id="hh"/><type>${type}</type><stem>up</stem><notehead${hollow?' filled="no"':''}>normal</notehead></note>`;
const xml=`<?xml version="1.0"?><score-partwise version="4.0"><work><work-title>Synthetic hollow noteheads</work-title></work><part-list><score-part id="P1"><part-name>Percussion</part-name><score-instrument id="hh"><instrument-name>Open hi-hat</instrument-name></score-instrument><midi-instrument id="hh"><midi-channel>10</midi-channel><midi-unpitched>47</midi-unpitched></midi-instrument></score-part></part-list><part id="P1">${[['quarter',4],['eighth',2],['16th',1]].map(([type,d],i)=>`<measure number="${i+1}">${i===0?'<attributes><divisions>4</divisions><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>percussion</sign></clef></attributes>':''}${note(type,d,true)}${note(type,d,false)}<forward><duration>${16-2*d}</duration></forward></measure>`).join('')}</part></score-partwise>`;
window.reproXML=xml;
try{
const osmd=new OpenSheetMusicDisplay('score',{backend:'svg',autoResize:false,drawTitle:false});await osmd.load(xml);osmd.render();
window.results=osmd.GraphicSheet.MeasureList.map(([m])=>m.staffEntries.flatMap(e=>e.graphicalVoiceEntries.flatMap(v=>v.notes.map(n=>({length:n.sourceNote.Length.RealValue,filled:n.sourceNote.Notehead?.Filled,key:n.vfnote[0].getKeyProps(),paths:n.getNoteheadSVGs().map(x=>x.innerHTML)})))));
document.querySelector('#result').textContent=JSON.stringify(window.results,null,2);
}catch(e){document.querySelector('#result').textContent=String(e);}
</script></body></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드럼 표기법 나란히 비교</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#20304a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 12px}p{line-height:1.6}header{margin-bottom:26px}.heads,.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.heads{position:sticky;top:0;z-index:2;background:#f4f6faf5;padding:12px 0;font-weight:700}.heads div{padding:12px;background:#e6ecf6;border-radius:10px}.pair{margin:10px 0 24px}article{background:white;border:1px solid #d5dfed;border-radius:14px;overflow:hidden;padding:16px}h2{font-size:20px;margin:32px 0 8px}h3{font-size:17px;margin:0}svg{width:100%;height:auto;display:block}small{display:block;line-height:1.5;color:#596880}.tag{color:#235ec0;font-weight:650;margin-top:8px}.absent{height:178px;display:flex;align-items:center;justify-content:center;color:#69788f;background:#f8f9fc;border-radius:10px}footer{margin-top:30px;color:#68758a} @media(max-width:550px){main{padding:12px}article{padding:9px}h1{font-size:23px}.heads,.pair{gap:8px}}</style>
<main><header><h1>드럼 표기법, 눈으로 비교하기</h1><p>왼쪽은 오늘 주신 <b>이전 상세 범례</b>, 오른쪽은 <b>최신 Drum Key</b>입니다.<br>오선 간격과 음표 크기를 동일하게 다시 그렸습니다. 파란 선은 제5선입니다.</p><small>첨부 범례의 위치·모양 비교용 SVG입니다. OSMD 렌더링 결과나 확정 매핑이 아닙니다.</small></header><div class="heads"><div>이전 상세 범례</div><div>최신 Drum Key</div></div><div id="rows"></div><footer>이 화면은 비교 자료입니다. 실제 곡·매핑 정본은 변경하지 않았습니다.</footer></main>
<script>
// y=100 is line 5 (F5); each step is 8 px. line 1 (E4) is y=164.
const pos={A5:84,G5:92,F5:100,E5:108,D5:116,C5:124,B4:132,A4:140,G4:148,F4:156,E4:164,D4:180};
function head(x,y,shape){if(shape==='normal')return `<ellipse cx="${x}" cy="${y}" rx="10" ry="7" transform="rotate(-20 ${x} ${y})" fill="#172033"/>`;if(shape==='triangle')return `<path d="M${x-10} ${y+6}L${x} ${y-10}L${x+10} ${y+6}Z" fill="#172033"/>`;if(shape==='diamond')return `<path d="M${x} ${y-10}L${x+9} ${y}L${x} ${y+10}L${x-9} ${y}Z" fill="#172033"/>`;return `${shape==='circle-x'?`<circle cx="${x}" cy="${y}" r="12" fill="white" stroke="#172033" stroke-width="2.2"/>`:''}<path d="M${x-8} ${y-8}L${x+8} ${y+8}M${x-8} ${y+8}L${x+8} ${y-8}" stroke="#172033" stroke-width="2.7"/>`}
function staff(notes){let s='<svg viewBox="0 0 440 224" role="img" aria-label="오선 위 표기 비교">';for(let i=0;i<5;i++)s+=`<line x1="30" x2="420" y1="${100+i*16}" y2="${100+i*16}" stroke="${i===0?'#3f74d4':'#758194'}" stroke-width="${i===0?2:1}"/>`;s+='<text x="4" y="104" font-size="12" fill="#3f74d4">5</text><text x="4" y="168" font-size="12" fill="#758194">1</text>';notes.forEach((n,i)=>{let x=notes.length===1?220:110+i*220/(notes.length-1),y=pos[n[0]];if(y<=84)s+=`<line x1="${x-17}" x2="${x+17}" y1="84" y2="84" stroke="#172033"/>`;let down=n[0]==='D4'||n[0]==='F4'||n[0]==='E4';s+=`<path d="M${x+8} ${y}V${down?y+32:y-50}" stroke="#172033" stroke-width="2"/>`+head(x,y,n[1]);if(n[2])s+=`<text x="${x}" y="${y-65}" text-anchor="middle" font-size="26" fill="#172033">${n[2]}</text>`;if(n[3])s+=`<text x="${x}" y="220" text-anchor="middle" font-size="14" fill="#425470">${n[3]}</text>`});return s+'</svg>'}
function card(title,notes,caption){return `<article><h3>${title}</h3>${notes?staff(notes):'<div class="absent">이 범례에는 표시 없음</div>'}<small>${caption}</small></article>`}
function row(title,a,b){document.querySelector('#rows').insertAdjacentHTML('beforeend',`<h2>${title}</h2><div class="pair">${card(...a)}${card(...b)}</div>`)}
row('1. 닫힌 상태의 하이햇',['하이햇',[['G5','x']],'제5선 바로 위 공간 · 이전 그림의 명칭은 “하이햇”'],['Closed Hi-Hat',[['F5','x']],'제5선 위 · 위치가 반 칸 내려갑니다.']);
row('2. 열린 상태의 하이햇',['오픈 하이햇',[['G5','circle-x']],'제5선 바로 위 공간 · 원 안의 ×'],['Open Hi-Hat',[['F5','circle-x']],'제5선 위 · 모양은 같고 위치가 반 칸 내려갑니다.']);
row('3. 하이햇을 여는 / 닫는 동작 지시',['Hi-Hat Open / Close',[['G5','x','○','열기'],['G5','x','＋','닫기']],'음표 위 ○ / ＋. 위의 열린·닫힌 상태 표기와 별개입니다.'],['동작 지시',null,'최신 범례에 없다는 뜻입니다. Open / Closed Hi-Hat으로 대체하지 않습니다.']);
row('4. 라이드',['라이드 심벌',[['F5','x']],'제5선 위 · ×'],['Ride',[['G5','x']],'제5선 바로 위 공간 · 위치가 반 칸 올라갑니다.']);
row('5. 라이드 벨',['라이드 벨',[['F5','triangle']],'제5선 위 · 채운 삼각형 ▲'],['Ride Bell',[['G5','diamond']],'제5선 바로 위 공간 · 채운 마름모 ◆']);
row('6. 크래시',['크래시 심벌',[['A5','circle-x']],'위쪽 첫 덧줄 · 원 안의 ×. 이전 “상세 범례” 기준입니다.'],['Crash',[['A5','x']],'같은 덧줄 위치 · ×. 원이 없습니다.']);
row('7. 낮은 탐 구성',['플로어 탐',[['A4','normal']],'제2·3선 사이. 악기 이름은 “플로어 탐”입니다.'],['Tom 3 / 4 / 5',[['B4','normal',null,'Tom 3'],['A4','normal',null,'Tom 4'],['G4','normal',null,'Tom 5']],'기존 플로어 탐과 같은 높이는 Tom 4입니다. 같은 악기라는 뜻은 아닙니다.']);
row('8. 킥 구성',['베이스 드럼',[['F4','normal']],'제1·2선 사이 · 한 종류로 표시'],['Right Bass / Left Bass',[['F4','normal',null,'오른발'],['E4','normal',null,'왼발']],'오른발은 기존 높이, 왼발은 제1선입니다.']);
document.querySelector('#rows').insertAdjacentHTML('beforeend','<h2>나머지 항목</h2><article><p><b>기존과 같은 위치·모양:</b> 스네어, 고스트 노트, Tom 1·2, 크로스 스틱/Rim Click, 풋 하이햇/Hi-Hat Pedal.</p><p><b>최신에 추가:</b> China, Splash, Cowbell, Choked Crash, Snare Doubles, Snare Buzz, Hi-Hat Splash.</p><p><b>이전에만 표시:</b> R/L 스티킹. 하이햇 Open/Close 동작 지시는 위에서 별도로 비교했습니다.</p></article>');
</script></html>
